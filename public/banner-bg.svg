<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E7"/>
      <stop offset="100%" stop-color="#F3E4D0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bgGrad)"/>

  <!-- steam swirls -->
  <g stroke="#3A2E22" stroke-width="3" fill="none" opacity="0.15" stroke-linecap="round">
    <path d="M90 90 Q100 70 90 55 Q80 40 90 20"/>
    <path d="M115 90 Q125 70 115 55 Q105 40 115 20"/>
    <path d="M140 90 Q150 70 140 55 Q130 40 140 20"/>
  </g>

  <!-- pot -->
  <g opacity="0.18">
    <rect x="55" y="90" width="120" height="55" rx="14" fill="#B8542F"/>
    <ellipse cx="60" cy="105" rx="9" ry="14" fill="none" stroke="#B8542F" stroke-width="6"/>
    <ellipse cx="170" cy="105" rx="9" ry="14" fill="none" stroke="#B8542F" stroke-width="6"/>
    <rect x="50" y="82" width="130" height="12" rx="6" fill="#3A2E22"/>
    <circle cx="115" cy="76" r="7" fill="#3A2E22"/>
  </g>

  <!-- citrus slice -->
  <g opacity="0.15" transform="translate(680,60)">
    <circle r="34" fill="none" stroke="#D4A24C" stroke-width="5"/>
    <circle r="24" fill="none" stroke="#D4A24C" stroke-width="3"/>
    <g stroke="#D4A24C" stroke-width="3">
      <line x1="0" y1="-24" x2="0" y2="24"/>
      <line x1="-21" y1="-12" x2="21" y2="12"/>
      <line x1="-21" y1="12" x2="21" y2="-12"/>
    </g>
  </g>

  <!-- leaf sprig -->
  <g opacity="0.18" transform="translate(720,210) rotate(15)">
    <path d="M0 0 Q20 -10 40 0 Q20 10 0 0Z" fill="#5C7047"/>
    <path d="M40 0 Q60 -10 80 0 Q60 10 40 0Z" fill="#5C7047"/>
    <path d="M80 0 Q100 -10 120 0 Q100 10 80 0Z" fill="#5C7047"/>
    <line x1="0" y1="0" x2="125" y2="0" stroke="#5C7047" stroke-width="2"/>
  </g>

  <!-- small dot texture -->
  <g fill="#B8542F" opacity="0.12">
    <circle cx="300" cy="40" r="4"/>
    <circle cx="330" cy="250" r="5"/>
    <circle cx="500" cy="30" r="3"/>
    <circle cx="600" cy="260" r="4"/>
    <circle cx="450" cy="150" r="3"/>
    <circle cx="250" cy="180" r="4"/>
  </g>

  <!-- whisk -->
  <g opacity="0.15" transform="translate(600,190) rotate(-20)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#3A2E22" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0 Q-18 -30 0 -55 Q18 -30 0 0" fill="none" stroke="#3A2E22" stroke-width="3"/>
    <path d="M0 0 Q-10 -35 0 -58 Q10 -35 0 0" fill="none" stroke="#3A2E22" stroke-width="3"/>
  </g>
</svg>
